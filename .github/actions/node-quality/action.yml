name: node-quality
description: npm ci, tests y npm audit (high o superior fallan el job)

inputs:
  working-directory:
    description: Directorio del package.json
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Install
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci
    - name: Test
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm test
    - name: Audit
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm audit --audit-level=high
