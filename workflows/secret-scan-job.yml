# Job reutilizable (copiar dentro de un workflow).
#
# No se reparte el binario de Gitleaks. El job llama a
# gitleaks/gitleaks-action@v2. Trátalo como dependencia de terceros:
# revisa el repositorio, los permisos que pide y, en producción, fíjalo
# por SHA de commit en lugar de la etiqueta mayor.
#
# GITLEAKS_LICENSE es obligatorio en organizaciones de GitHub que no
# entren en el uso gratuito del action. En un repositorio público suele
# bastar el token.
#
# Permisos del job: contents: read. fetch-depth: 0 para historial completo.

secret-scan:
  runs-on: ubuntu-latest
  permissions:
    contents: read
  steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
